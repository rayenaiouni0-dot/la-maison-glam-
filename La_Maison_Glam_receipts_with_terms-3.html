<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#563d53"><meta name="description" content="La Maison Glam — gestion de location de robes et tenues traditionnelles"><link rel="manifest" href="manifest.webmanifest">
<title>La Maison Glam — Gestion de location</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--plum:#563d53;--rose:#a77f98;--gold:#b18b55;--cream:#fbf7f1;--line:#eadfe7;--ink:#302832;--muted:#817681;--green:#39785b;--red:#a34444}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(120deg,#493347,#795b72);color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:800;letter-spacing:.3px}.brand small{display:block;font-size:11px;font-weight:400;color:#eadde8;margin-top:4px}
.wrap{max-width:1200px;margin:auto;padding:18px}.topline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--plum);color:white;cursor:pointer;font-weight:700}
button.secondary{background:#efe6ed;color:var(--plum)}button.gold{background:var(--gold)}button.danger{background:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:white;color:var(--ink);font:inherit}
label{font-size:13px;color:var(--muted);display:block;margin:7px 0 5px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:15px}
.stat b{display:block;font-size:24px;color:var(--plum);margin-top:7px}.muted{color:var(--muted);font-size:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}nav button{background:#eee5ec;color:var(--plum)}nav button.active{background:var(--plum);color:white}
h2{font-size:19px;margin:0 0 12px;color:var(--plum)}h3{font-size:15px;color:var(--plum);margin:0 0 10px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.formgrid .full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:13px;background:white}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{background:#f7f0f5;color:var(--plum)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.tag{display:inline-block;border-radius:20px;padding:4px 8px;background:#f1eaf0;color:var(--plum);font-size:11px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:11px;padding:7px 9px}
.hidden{display:none!important}.notice{background:#fff7e8;border:1px solid #ead8b7;border-radius:12px;padding:12px;font-size:13px;line-height:1.7;margin-bottom:14px}
.login{max-width:440px;margin:7vh auto;background:white;padding:24px;border:1px solid var(--line);border-radius:18px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:12px}.formgrid{grid-template-columns:1fr}}
@media(max-width:520px){header{padding:14px}.brand{font-size:19px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:11px}.stat b{font-size:19px}th,td{padding:8px;font-size:12px}}
@media print{header,nav,.no-print,button{display:none!important}body{background:white}.wrap{max-width:none;padding:0}.panel{border:0}}
</style>
</head>
<body>
<header><div class="brand">♛ La Maison Glam <small>LOCATION DE ROBES & TENUES TRADITIONNELLES</small></div><div class="topline"><span id="who"></span><button class="secondary" onclick="logout()">تسجيل الخروج</button></div></header>
<div id="setup" class="login hidden">
<h2>إعداد التطبيق لأول مرة</h2><div class="notice">أنشئي حساب المالكة وأول حساب موظفة. يمكنك إضافة موظفات أخريات لاحقاً.</div>
<label>كلمة سر المالكة</label><input id="passOwner" type="password" placeholder="6 أحرف على الأقل">
<label>اسم أول موظفة</label><input id="firstStaffName" placeholder="مثلاً: نور">
<label>كلمة سر أول موظفة</label><input id="passStaff" type="password" placeholder="6 أحرف على الأقل">
<button style="width:100%;margin-top:14px" onclick="setupAccounts()">إنشاء الحسابات</button>
</div>
<div id="login" class="login hidden">
<h2>تسجيل الدخول</h2>
<label>البريد الإلكتروني</label><input id="loginEmail" type="email" value="rayenaiouni0@gmail.com" autocomplete="username">
<label>كلمة السر</label><input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
<button style="width:100%;margin-top:14px" onclick="login()">دخول</button><p id="loginErr" class="muted"></p>
<p class="muted">الدخول يتم عبر حساب Supabase الآمن.</p>
</div>
<div id="connectionState" class="wrap hidden" style="padding-top:0"><div class="notice" id="connectionText">جاري الاتصال بقاعدة البيانات…</div></div>
<main id="app" class="wrap hidden">

<nav id="nav"></nav><section id="view"></section>
</main>
<script>
const KEY='lmg_data_v1', AUTH='lmg_auth_v1';
const SUPABASE_URL='https://iyqczxilmyltgtzkqhkv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_vlsXllmyJc8bsWyG-2Ziig_ioCZEzNT';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cloudReady=false, cloudSaving=false, cloudSaveTimer=null, authUser=null;
let db={accounts:null,items:[],clients:[],bookings:[],expenses:[],payments:[],activity:[]},role=null,tab='home',currentUserName='',currentPermissions=null;
const $=id=>document.getElementById(id), money=n=>(Number(n)||0).toLocaleString('fr-DZ')+' DA', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){
 try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}
 if(!db.items)db.items=[];if(!db.clients)db.clients=[];if(!db.bookings)db.bookings=[];if(!db.expenses)db.expenses=[];if(!db.payments)db.payments=[];if(!db.activity)db.activity=[];
 if(db.accounts && typeof db.accounts.owner==='string'){
   db.accounts={owner:{name:'ريان',password:db.accounts.owner},employees:[{id:'legacy-staff',name:'نور',password:db.accounts.staff||'',active:true}]};
 }
 if(db.accounts && !Array.isArray(db.accounts.employees))db.accounts.employees=[];
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 if(cloudReady){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(pushCloudState,650)}
}
async function pushCloudState(){
 if(!cloudReady||cloudSaving||!authUser)return;
 cloudSaving=true;
 try{
  const payload={...db,accounts:null};
  const {error}=await supabaseClient.from('app_state').upsert({id:1,data:payload,updated_at:new Date().toISOString(),updated_by:authUser.id},{onConflict:'id'});
  if(error)throw error;
  setConnection('متصل — آخر التغييرات محفوظة في قاعدة البيانات.',true);
 }catch(e){console.error(e);setConnection('تعذر حفظ التغييرات في السحابة: '+(e.message||'تحققي من صلاحيات app_state'),false)}
 finally{cloudSaving=false}
}
function setConnection(message,ok){$('connectionState').classList.remove('hidden');$('connectionText').textContent=message;$('connectionText').style.background=ok?'#edf8f0':'#fff2ed';}
async function pullCloudState(){
 const {data,error}=await supabaseClient.from('app_state').select('data').eq('id',1).maybeSingle();
 if(error)throw error;
 if(data?.data){
  const remote=data.data;
  const keys=['items','clients','bookings','expenses','payments','activity'];
  const remoteHasData=keys.some(k=>Array.isArray(remote[k])&&remote[k].length>0);
  const localHasData=keys.some(k=>Array.isArray(db[k])&&db[k].length>0);
  if(!remoteHasData&&localHasData){
   const payload={...db,accounts:null};
   const {error:saveError}=await supabaseClient.from('app_state').upsert({id:1,data:payload,updated_at:new Date().toISOString(),updated_by:authUser.id},{onConflict:'id'});
   if(saveError)throw saveError;
  }else{
   db={...db,...remote,accounts:null};keys.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});localStorage.setItem(KEY,JSON.stringify(db));
  }
 }else {const payload={...db,accounts:null};const {error:saveError}=await supabaseClient.from('app_state').upsert({id:1,data:payload,updated_at:new Date().toISOString(),updated_by:authUser.id},{onConflict:'id'});if(saveError)throw saveError}
}
function refreshLoginAccounts(){
 const sel=$('loginRole');if(!sel)return;
 let opts='<option value="owner">المالكة — ريان</option>';
 (db.accounts?.employees||[]).filter(e=>e.active!==false).forEach(e=>opts+=`<option value="${esc(e.id)}">${esc(e.name)} — موظفة</option>`);
 sel.innerHTML=opts;
}
async function boot(){
 load();$('setup').classList.add('hidden');$('login').classList.remove('hidden');$('connectionState').classList.remove('hidden');
 try{const {data:{session}}=await supabaseClient.auth.getSession();if(session){authUser=session.user;await enterApp()}else setConnection('جاهز لتسجيل الدخول إلى قاعدة البيانات.',true)}
 catch(e){setConnection('تعذر الاتصال بـ Supabase: '+(e.message||''),false)}
}
function setupAccounts(){
 let a=$('passOwner').value,b=$('passStaff').value,n=$('firstStaffName').value.trim()||'الموظفة الأولى';
 if(a.length<6||b.length<6)return alert('كلمة السر يجب أن تكون 6 أحرف على الأقل');
 db.accounts={owner:{name:'ريان',password:a},employees:[{id:'emp-'+Date.now(),name:n,password:b,active:true}]};
 save();$('setup').classList.add('hidden');refreshLoginAccounts();$('login').classList.remove('hidden');
}
async function login(){
 const email=$('loginEmail').value.trim(),password=$('loginPass').value;
 $('loginErr').textContent='جاري فحص الاتصال ثم تسجيل الدخول…';
 try{
  if(!window.supabase?.createClient) throw new Error('مكتبة Supabase لم تُحمّل. تحققي من اتصال الإنترنت ثم أعيدي فتح التطبيق.');
  // A lightweight in-app health check gives a clearer diagnosis than the generic Failed to fetch.
  let health;
  try{
   health=await fetch(SUPABASE_URL+'/auth/v1/health',{method:'GET',headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});
  }catch(netErr){
   const localFile=location.protocol==='file:';
   throw new Error(localFile
    ? 'المتصفح يمنع الاتصال لأن التطبيق مفتوح كملف من الكمبيوتر (file://). افتحي التطبيق عبر استضافة HTTPS أو خادم محلي؛ رابط Supabase نفسه يعمل.'
    : 'تعذر الوصول إلى خدمة Supabase من هذه الصفحة. تحققي من الإنترنت أو VPN أو مانع الإعلانات، ثم أعيدي المحاولة.');
  }
  if(!health.ok) throw new Error('خدمة Supabase ردّت برمز '+health.status+'. تحققي من إعدادات المشروع والمفتاح.');
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)throw error;
  authUser=data.user;await enterApp();
 }catch(e){
  console.error('La Maison Glam login error:',e);
  $('loginErr').textContent='فشل الدخول: '+(e.message||'تحققي من البريد وكلمة السر');
 }
}
async function enterApp(){
 const {data:profile,error:profileError}=await supabaseClient.from('staff_profiles').select('user_id,role,full_name,active,permissions').eq('user_id',authUser.id).maybeSingle();
 if(profileError)throw profileError;
 if(profile && profile.active===false){await supabaseClient.auth.signOut();authUser=null;throw new Error('هذا الحساب موقوف. تواصلي مع المالكة.')}
 if(profile){role=profile.role==='owner'?'owner':'staff';currentUserName=profile.full_name||authUser.email||'مستخدمة';currentPermissions=Array.isArray(profile.permissions)&&profile.permissions.length?profile.permissions:null}
 else if(authUser.email?.toLowerCase()==='rayenaiouni0@gmail.com'){role='owner';currentUserName='مسؤولة La Maison Glam';currentPermissions=null}
 else {await supabaseClient.auth.signOut();authUser=null;throw new Error('الحساب غير مسجل في staff_profiles. أضيفيه من Supabase أولاً.')}
 try{await pullCloudState();cloudReady=true}catch(e){cloudReady=false;setConnection('تم الدخول لكن تعذرت قراءة app_state: '+(e.message||''),false);throw e}
 $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=role==='owner'?`${currentUserName} — المالكة`:`${currentUserName} — موظفة`;
 setConnection('متصل بقاعدة البيانات. البيانات المشتركة جاهزة.',true);render();
}
async function logout(){await supabaseClient.auth.signOut();authUser=null;cloudReady=false;role=null;currentUserName='';currentPermissions=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginPass').value='';setConnection('تم تسجيل الخروج.',true)}
const tabs=[['home','لوحة التحكم'],['items','خزانة الملابس'],['availability','هل الفستان متاح؟'],['clients','الزبونات'],['bookings','الحجوزات'],['returns','التسليم والإرجاع'],['receipts','الوصولات'],['finance','الحسابات'],['payments','الدفعات'],['reports','التقارير'],['activity','سجل النشاط'],['settings','الإعدادات']];
function render(){let allowed=tabs.filter(t=>role==='owner'||(Array.isArray(currentPermissions)&&currentPermissions.length?currentPermissions.includes(t[0]):!['finance','payments','reports','activity','settings'].includes(t[0])));if(!allowed.some(t=>t[0]===tab))tab='home';$('nav').innerHTML=allowed.map(t=>`<button class="${tab===t[0]?'active':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');let v=$('view');({home:home,items:itemsPage,availability:availabilityPage,clients:clientsPage,bookings:bookingsPage,returns:returnsPage,receipts:receiptsPage,finance:financePage,payments:paymentsPage,reports:reportsPage,activity:activityPage,settings:settingsPage}[tab]||home)(v)}
function home(v){let active=db.bookings.filter(b=>b.status!=='ملغى');let due=active.filter(b=>b.returnDate===today()).length;let rented=db.items.filter(i=>i.status==='مؤجر').length;v.innerHTML=`<h2>لوحة التحكم</h2><div class="grid"><div class="stat">القطع المسجلة<b>${db.items.length}</b></div><div class="stat">الحجوزات النشطة<b>${active.length}</b></div><div class="stat">قطع عند الزبونات<b>${rented}</b></div><div class="stat">إرجاع اليوم<b>${due}</b></div></div><div class="panel" style="margin-top:14px"><h3>تذكيرات الإرجاع</h3>${reminders()}</div><div class="panel" style="margin-top:14px"><h3>آخر الحجوزات</h3>${bookingTable(db.bookings.slice(-5).reverse())}</div>`}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function logAction(action,details=''){db.activity.unshift({id:Date.now()+Math.random(),date:new Date().toLocaleString('fr-DZ'),user:currentUserName||'النظام',role:role||'system',action,details});if(db.activity.length>2000)db.activity.length=2000;}
function reminders(){let list=db.bookings.filter(b=>!['ملغى','مكتمل'].includes(b.status)&&b.returnDate).filter(b=>{let d=(new Date(b.returnDate+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000;return d<=1});return list.length?list.map(b=>`<p>🔔 ${esc(b.clientName)} — ${esc(b.itemCode)} — ${b.returnDate} ${b.returnDate<today()?'<b style="color:#a34444">متأخر</b>':'تذكير قريب'}</p>`).join(''):'لا توجد إرجاعات مستحقة اليوم أو غداً.'}

let selectedItemPhoto='';
function previewItemPhoto(event){
 const file=event.target.files?.[0];
 if(!file){selectedItemPhoto='';$('photoPreview').innerHTML='';return}
 if(!file.type.startsWith('image/')){alert('اختاري ملف صورة فقط');event.target.value='';return}
 if(file.size>12*1024*1024){alert('الصورة كبيرة بزاف. اختاري صورة أقل من 12 ميغابايت.');event.target.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height));
   const canvas=document.createElement('canvas');
   canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   selectedItemPhoto=canvas.toDataURL('image/jpeg',0.78);
   $('photoPreview').innerHTML=`<img src="${selectedItemPhoto}" alt="معاينة الصورة" style="max-width:180px;max-height:180px;object-fit:contain;border-radius:12px;border:1px solid var(--line)">`;
  };
  img.onerror=()=>alert('تعذر قراءة الصورة');
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

function itemsPage(v){selectedItemPhoto='';v.innerHTML=`<h2>خزانة الملابس</h2><div class="panel"><h3>إضافة قطعة جديدة</h3><div class="formgrid">
<div><label>رقم القطعة</label><input id="itCode" placeholder="ROB-001"></div><div><label>النوع</label><select id="itType"><option>فستان سهرة</option><option>فستان عرس</option><option>قفطان</option><option>لباس تقليدي</option></select></div>
<div><label>الوصف</label><input id="itName" placeholder="الوصف أو الاسم"></div><div><label>اللون</label><input id="itColor"></div><div><label>المقاس</label><input id="itSize"></div><div><label>سعر الكراء (دج)</label><input id="itPrice" type="number" min="0"></div><div><label>الضمان الافتراضي (دج)</label><input id="itDeposit" type="number" min="0"></div><div class="full"><label>تحميل صورة القطعة (اختياري)</label><input id="itPhotoFile" type="file" accept="image/*" onchange="previewItemPhoto(event)"><div id="photoPreview" style="margin-top:8px"></div><small class="muted">اختاري صورة من الهاتف أو الكمبيوتر، وستظهر داخل بطاقة القطعة.</small></div></div><button style="margin-top:12px" onclick="addItem()">إضافة للخزانة</button></div><div class="tablewrap">${itemTable()}</div>`}
async function uploadItemPhoto(dataUrl,code){if(!dataUrl||!dataUrl.startsWith('data:image/'))return dataUrl||'';const blob=await (await fetch(dataUrl)).blob();const ext=(blob.type.split('/')[1]||'jpeg').replace('jpeg','jpg');const path=`items/${Date.now()}-${String(code).replace(/[^a-zA-Z0-9_-]/g,'_')}.${ext}`;const {error}=await supabaseClient.storage.from('dress-photos').upload(path,blob,{contentType:blob.type,upsert:false});if(error)throw error;const {data}=supabaseClient.storage.from('dress-photos').getPublicUrl(path);return data.publicUrl}
async function addItem(){let code=$('itCode').value.trim();if(!code||db.items.some(i=>i.code===code))return alert('أدخلي رقم قطعة فريداً');const btn=document.querySelector('#view button[onclick="addItem()"]');if(btn)btn.disabled=true;try{let photo=selectedItemPhoto?await uploadItemPhoto(selectedItemPhoto,code):'';let x={id:Date.now(),code,type:$('itType').value,name:$('itName').value,color:$('itColor').value,size:$('itSize').value,price:+$('itPrice').value,deposit:+$('itDeposit').value,photo,status:'متاح'};db.items.push(x);logAction('إضافة قطعة',x.code+' — '+(x.name||x.type));save();render()}catch(e){alert('ما قدرناش نرفعو الصورة. تأكدي من إنشاء Storage bucket باسم dress-photos وصلاحياته. '+(e.message||''));if(btn)btn.disabled=false}}
function itemTable(){return `<table><thead><tr><th>الرقم</th><th>القطعة</th><th>المقاس</th><th>الكراء</th><th>الحالة</th><th></th></tr></thead><tbody>${db.items.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.name||i.type)} ${i.photo?`<br><img src="${i.photo}" alt="صورة ${esc(i.code)}" style="width:82px;height:92px;object-fit:cover;border-radius:9px;margin-top:6px">`:''}</td><td>${esc(i.size)}</td><td>${money(i.price)}</td><td><span class="tag">${esc(i.status)}</span></td><td>${role==='owner'?`<button class="danger" onclick="delItem(${i.id})">حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد قطع مسجلة بعد</td></tr>'}</tbody></table>`}
function delItem(id){if(confirm('حذف القطعة؟')){let removed=db.items.find(i=>i.id===id);db.items=db.items.filter(i=>i.id!==id);logAction('حذف قطعة',removed?.code||String(id));save();render()}}

function availabilityPage(v){
v.innerHTML=`<h2>هل الفستان متاح؟</h2>
<div class="panel">
<h3>البحث عن توفر قطعة</h3>
<label>اختاري القطعة</label>
<select id="avItem">${db.items.map(i=>`<option value="${esc(i.code)}">${esc(i.code)} — ${esc(i.name||i.type)}</option>`).join('')}</select>
<div class="formgrid">
<div><label>من تاريخ</label><input type="date" id="avFrom"></div>
<div><label>إلى تاريخ</label><input type="date" id="avTo"></div>
</div>
<button style="margin-top:12px" onclick="checkAvailability()">تحققي من التوفر</button>
<div id="avResult" style="margin-top:14px"></div>
</div>

function checkAvailability(){

if(!code||!from||!to||from>to)return alert('اختاري القطعة وتحققي من التواريخ');
let item=db.items.find(i=>i.code===code);
let clashes=db.bookings.filter(b=>b.itemCode===code&&!['ملغى','مكتمل'].includes(b.status)&&from<=b.returnDate&&to>=b.delivery);

}

function addBooking(){let c=db.clients.find(x=>x.id==$('bkClient').value),i=db.items.find(x=>x.code===$('bkItem').value);if(!c||!i)return alert('سجلي الزبونة والقطعة أولاً');let ev=$('bkEvent').value,d=$('bkDelivery').value,r=$('bkReturn').value;if(!ev||!d||!r||d>ev||r<ev)return alert('راجعي التواريخ');let clash=db.bookings.some(b=>b.itemCode===i.code&&!['ملغى','مكتمل'].includes(b.status)&&d<=b.returnDate&&r>=b.delivery);if(clash)return alert('هذه القطعة محجوزة خلال هذه الفترة. اختاري قطعة أو تاريخاً آخر.');let rent=+$('bkRent').value||i.price,dep=+$('bkDeposit').value||i.deposit,adv=+$('bkAdvance').value||0;if(adv>rent)return alert('التسبيق لا يمكن أن يتجاوز سعر الكراء');let b={id:Date.now(),ref:'RES-'+String(db.bookings.length+1).padStart(4,'0'),clientId:c.id,clientName:c.name,phone:c.phone,itemCode:i.code,event:ev,delivery:d,returnDate:r,rent,deposit:dep,advance:adv,notes:$('bkNotes').value,status:'محجوز',depositStatus:'لم يُرجع'};db.bookings.push(b);logAction('تسجيل حجز',b.ref+' — '+b.clientName+' — '+b.itemCode);save();render();alert('تم تسجيل الحجز')}

function deleteBooking(id){if(role!=='owner')return alert('حذف الحجوزات متاح للمالكة فقط');const b=db.bookings.find(x=>x.id===id);if(!b)return;if(!confirm(`تأكيد حذف الحجز ${b.ref} للزبونة ${b.clientName}؟ هذا الإجراء لا يمكن التراجع عنه.`))return;db.bookings=db.bookings.filter(x=>x.id!==id);logAction('حذف حجز',b.ref+' — '+b.clientName+' — '+b.itemCode);save();render();alert('تم حذف الحجز')}

function activityPage(v){
 v.innerHTML=`<h2>سجل نشاط الموظفات</h2><p class="muted">يسجل هذا الجدول العمليات الأساسية التي تمت داخل التطبيق وعلى هذا الحاسوب.</p>
 <div class="tablewrap"><table><tr><th>التاريخ والوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr>
 ${db.activity.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد عمليات مسجلة بعد</td></tr>'}
 </table></div><button class="secondary no-print" style="margin-top:12px" onclick="window.print()">طباعة السجل</button>`;
}
function reportsPage(v){let total=db.bookings.filter(b=>b.status!=='ملغى').reduce((s,b)=>s+b.rent,0),paid=db.bookings.filter(b=>b.status!=='ملغى').reduce((s,b)=>s+(b.advance||0),0)+db.payments.reduce((s,p)=>s+(db.bookings.find(b=>b.id===p.bookingId&&b.status!=='ملغى')?p.amount:0),0);v.innerHTML=`<h2>التقارير</h2><div class="grid"><div class="stat">قيمة عقود الكراء<b>${money(total)}</b></div><div class="stat">التسبيقات المقبوضة<b>${money(paid)}</b></div><div class="stat">الباقي لدى الزبونات<b>${money(total-paid)}</b></div><div class="stat">عدد الزبونات<b>${db.clients.length}</b></div></div><p class="muted">قيمة العقود ليست ربحاً صافياً؛ الربح يحتاج تسجيل جميع المصاريف والمبالغ المستحقة والمقبوضة.</p>`}
async function settingsPage(v){
 v.innerHTML=`<h2>إدارة الموظفات والإعدادات</h2>
 <div class="panel"><h3>إضافة حساب موظفة حقيقي</h3><p class="muted">كل موظفة تدخل ببريدها وكلمة سرها. إنشاء الحساب يتم بأمان عبر Supabase Edge Function، وليس بكلمات مرور محفوظة داخل التطبيق.</p><div class="formgrid"><div><label>اسم الموظفة</label><input id="newEmpName" placeholder="الاسم الكامل"></div><div><label>البريد الإلكتروني</label><input id="newEmpEmail" type="email" placeholder="staff@example.com"></div><div><label>كلمة السر المؤقتة</label><input id="newEmpPass" type="password" minlength="6" placeholder="6 أحرف على الأقل"></div></div><label>الصلاحيات المسموحة</label><div class="formgrid">${tabs.filter(t=>t[0]!=='settings').map(t=>`<label><input type="checkbox" class="empPermission" value="${t[0]}" ${['home','items','availability','clients','bookings','returns','receipts'].includes(t[0])?'checked':''} style="width:auto"> ${t[1]}</label>`).join('')}</div><button style="margin-top:12px" onclick="addEmployee()">إنشاء حساب الموظفة</button><p class="muted">ملاحظة: لازم إعداد Edge Function وSQL المرفقين مع الملفات مرة واحدة في Supabase.</p></div>
 <div class="panel" style="margin-top:14px"><h3>الموظفات المسجلات</h3><div id="staffList">جاري تحميل الحسابات…</div></div>
 <div class="panel" style="margin-top:14px"><h3>النسخ الاحتياطي</h3><p class="muted">نزّلي نسخة احتياطية بانتظام واحتفظي بها في مكان آمن.</p><button onclick="backup()">تنزيل نسخة احتياطية</button><hr><h3>استرجاع نسخة</h3><input type="file" id="restoreFile" accept="application/json"><button style="margin-top:10px" onclick="restore()">استرجاع البيانات</button><hr><h3>الصور</h3><p class="muted">صور القطع الجديدة تُرفع إلى Supabase Storage وتظهر من أي جهاز. الصور القديمة المخزنة كبيانات محلية تحتاج ترحيل منفصل.</p><button class="secondary" onclick="migrateOldPhotos()">ترحيل صور القطع القديمة إلى السحابة</button><hr><h3>ملاحظة الخصوصية</h3><p class="muted">احتفظي بنسخة احتياطية ولا تشاركيها.</p></div>`;
 await loadStaffList();
}
async function loadStaffList(){const host=$('staffList');if(!host)return;try{const {data,error}=await supabaseClient.from('staff_profiles').select('user_id,role,full_name,active,permissions').neq('role','owner').order('full_name');if(error)throw error;host.innerHTML=`<div class="tablewrap"><table><tr><th>الاسم</th><th>الصلاحيات</th><th>الحالة</th><th>إجراء</th></tr>${(data||[]).map(e=>`<tr><td>${esc(e.full_name||'—')}</td><td>${(Array.isArray(e.permissions)?e.permissions:[]).map(x=>tabs.find(t=>t[0]===x)?.[1]||x).join('، ')||'الافتراضية'}</td><td>${e.active===false?'موقوفة':'نشطة'}</td><td><button class="${e.active===false?'gold':'danger'}" onclick="toggleStaff('${e.user_id}',${e.active===false?'true':'false'})">${e.active===false?'تفعيل':'إيقاف'}</button></td></tr>`).join('')||'<tr><td colspan="4">لا توجد موظفات بعد</td></tr>'}</table></div>`}catch(e){host.textContent='تعذر تحميل الموظفات: '+(e.message||'تحققي من صلاحيات staff_profiles')}}
async function addEmployee(){const name=$('newEmpName').value.trim(),email=$('newEmpEmail').value.trim(),password=$('newEmpPass').value,permissions=[...document.querySelectorAll('.empPermission:checked')].map(x=>x.value);if(!name||!email||password.length<6)return alert('أدخلي الاسم والبريد وكلمة سر من 6 أحرف على الأقل');try{const {data,error}=await supabaseClient.functions.invoke('create-staff',{body:{name,email,password,permissions}});if(error)throw error;if(data?.error)throw new Error(data.error);logAction('إنشاء حساب موظفة',name+' — '+email);save();alert('تم إنشاء حساب الموظفة. تقدر تدخل بالبريد وكلمة السر المحددين.');render()}catch(e){alert('ما قدرناش ننشئو الحساب: '+(e.message||'تأكدي من نشر create-staff وضبط الأسرار في Supabase'))}}
async function toggleStaff(userId,active){if(!confirm(active?'تفعيل حساب الموظفة؟':'إيقاف حساب الموظفة؟'))return;try{const {error}=await supabaseClient.from('staff_profiles').update({active}).eq('user_id',userId);if(error)throw error;logAction(active?'تفعيل موظفة':'إيقاف موظفة',userId);save();await loadStaffList()}catch(e){alert('تعذر تحديث الحساب: '+(e.message||''))}}
async function migrateOldPhotos(){const old=db.items.filter(i=>i.photo&&i.photo.startsWith('data:image/'));if(!old.length)return alert('ما كاش صور قديمة تحتاج الترحيل');if(!confirm(`راح نرفع ${old.length} صورة إلى Supabase Storage. نكملو؟`))return;let ok=0;for(const item of old){try{item.photo=await uploadItemPhoto(item.photo,item.code);ok++}catch(e){console.error(e)}}save();render();alert(`تم رفع ${ok} من أصل ${old.length} صورة. ${old.length-ok?'بعض الصور فشل رفعها، عاودي المحاولة.':''}`)}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='la-maison-glam-backup-2026-11-18.json';a.click();URL.revokeObjectURL(a.href)}
function restore(){let f=$('restoreFile').files[0];if(!f)return alert('اختاري ملف النسخة');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.accounts||!Array.isArray(x.items))throw 0;db=x;save();alert('تم الاسترجاع');render()}catch(e){alert('ملف غير صالح')}};r.readAsText(f)}
boot();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('PWA:',e));
</script></body></html>
